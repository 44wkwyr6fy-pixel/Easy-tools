<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EasyTools - Bitcoin Profit Calculator</title>
<style>
* {
  box-sizing: border-box;
}
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f4f7fb;
  color: #172033;
}
header {
  background: #111827;
  color: white;
  text-align: center;
  padding: 30px 15px;
}
header h1 {
  margin: 0;
  font-size: 36px;
}
header p {
  margin: 8px 0 0;
  color: #cbd5e1;
}
.container {
  max-width: 600px;
  margin: 25px auto;
  padding: 0 15px;
}
.card {
  background: white;
  border-radius: 16px;
  padding: 22px;
  box-shadow: 0 4px 15px rgba(0,0,0,0.08);
}
h2 {
  margin-top: 0;
}
label {
  display: block;
  margin-top: 15px;
  font-weight: bold;
}
input {
  width: 100%;
  padding: 12px;
  margin-top: 6px;
  border: 1px solid #ccd3df;
  border-radius: 9px;
  font-size: 16px;
}
button {
  width: 100%;
  padding: 13px;
  margin-top: 20px;
  border: none;
  border-radius: 9px;
  background: #2563eb;
  color: white;
  font-size: 17px;
  font-weight: bold;
}
#result {
  display: none;
  margin-top: 20px;
  padding: 16px;
  background: #eef4ff;
  border-radius: 10px;
  line-height: 1.8;
}
</style>
</head>
<body>
<header>
  <h1>EasyTools</h1>
  <p>Simple & Useful Online Tools</p>
</header>
<div class="container">
  <div class="card">
    <h2>₿ Bitcoin Profit Calculator</h2>
    <label for="buyPrice">Buy Price (USD)</label>
    <input id="buyPrice" type="number" step="any" placeholder="Example: 60000">
    <label for="sellPrice">Sell Price (USD)</label>
    <input id="sellPrice" type="number" step="any" placeholder="Example: 65000">
    <label for="btcQuantity">Bitcoin Quantity (BTC)</label>
    <input id="btcQuantity" type="number" step="any" placeholder="Example: 0.10">
    <button type="button" onclick="calculateProfit()">Calculate</button>
    <div id="result"></div>
  </div>
</div>
<script>
function calculateProfit() {
  const buy = Number(document.getElementById("buyPrice").value);
  const sell = Number(document.getElementById("sellPrice").value);
  const quantity = Number(document.getElementById("btcQuantity").value);
  const result = document.getElementById("result");
  if (buy <= 0 || sell <= 0 || quantity <= 0) {
    result.style.display = "block";
    result.innerHTML = "⚠️ Please enter all three values.";
    return;
  }
  const investment = buy * quantity;
  const sellValue = sell * quantity;
  const profit = sellValue - investment;
  const percentage = (profit / investment) * 100;
  const status = profit >= 0 ? "Profit" : "Loss";
  result.style.display = "block";
  result.innerHTML =
    "<strong>Investment:</strong> $" + investment.toFixed(2) + "<br>" +
    "<strong>Sell Value:</strong> $" + sellValue.toFixed(2) + "<br>" +
    "<strong>" + status + ":</strong> $" + Math.abs(profit).toFixed(2) + "<br>" +
    "<strong>Return:</strong> " + percentage.toFixed(2) + "%";
}
</script>
</body>
</html>
